name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:i18n
      - run: pnpm check:hardcoded
      - run: pnpm check:themes
      - run: pnpm test:scripts
      - run: pnpm test
      - run: pnpm build

  integration:
    name: Integration tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openrent
          POSTGRES_PASSWORD: openrent
          POSTGRES_DB: openrent_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U openrent" --health-interval 5s --health-timeout 5s --health-retries 10
      # S3-compatible store for the storage plugin test (the image starts the server and creates the bucket).
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: openrent
          MINIO_ROOT_PASSWORD: openrent-ci
          MINIO_DEFAULT_BUCKETS: openrent
        ports: ['9000:9000']
    env:
      DATABASE_URL_TEST: postgres://openrent:openrent@localhost:5432/openrent_test
      S3_TEST_ENDPOINT: http://localhost:9000
      S3_TEST_BUCKET: openrent
      S3_TEST_ACCESS_KEY: openrent
      S3_TEST_SECRET_KEY: openrent-ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium renders document PDFs in the PDF and email tests.
      - run: pnpm --filter @openrent/api exec playwright install --with-deps chromium
      - run: pnpm test:integration
      - run: pnpm --filter @openrent/plugin-storage-s3 test

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:7432/postgres
      DATABASE_MIGRATION_URL: postgres://postgres:postgres@127.0.0.1:7432/postgres
      DATABASE_POOL_MAX: '4'
      OPENRENT_ENCRYPTION_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
      OPENRENT_SESSION_SECRET: ci-session-secret-that-is-long-enough-123
      PORT: '7070'
      OPENRENT_PUBLIC_URL: http://localhost:7070
      OPENRENT_API_URL: http://localhost:7070
      ADMIN_URL: http://localhost:7071/admin
      STOREFRONT_URL: http://localhost:7072
      WIDGET_URL: http://localhost:7073
      # Every e2e spec shares one staff session.
      RATE_LIMIT_PER_MINUTE: '5000'
      # The built-in plugins plus a test plugin with an admin bundle, a checkout field and a badge.
      PLUGINS_DIR: ${{ github.workspace }}/e2e/fixtures/plugins
      PLUGINS_CONFIG: ${{ github.workspace }}/e2e/fixtures/plugins.json
      OPENRENT_ALLOW_PLUGIN_UPLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start database and seed
        run: |
          pnpm db:pglite > pglite.log 2>&1 &
          for i in $(seq 1 30); do nc -z 127.0.0.1 7432 && break; sleep 1; done
          pnpm db:migrate
          pnpm db:seed
      - name: Start API, admin, storefront and widget
        run: |
          (cd apps/api && npx tsx src/server.ts > ../../api.log 2>&1 &)
          (cd apps/admin && npx vite dev --port 7071 --strictPort > ../../admin.log 2>&1 &)
          (cd apps/storefront && npx vite dev --port 7072 --strictPort > ../../storefront.log 2>&1 &)
          (cd apps/widget && npx vite --port 7073 --strictPort > ../../widget.log 2>&1 &)
          for p in 7070 7071 7072 7073; do for i in $(seq 1 60); do nc -z localhost $p && break; sleep 1; done; done
          # First requests compile the pages; warm them so test timeouts measure the app, not the bundler.
          for u in http://localhost:7072/ http://localhost:7071/admin/login http://localhost:7073/; do curl -s -o /dev/null "$u"; done
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            test-results/
            *.log

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build --target api -t openrent/api:ci .
      - run: docker build --target storefront -t openrent/storefront:ci .
