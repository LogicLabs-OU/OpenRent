apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openrent.fullname" . }}-api
  labels: {{- include "openrent.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {{- include "openrent.selector" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "openrent.selector" (dict "root" . "component" "api") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ include "openrent.image" (dict "root" . "name" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 7070 }]
          env:
            {{- include "openrent.env" . | nindent 12 }}
            - name: AUTO_MIGRATE
              value: {{ (not .Values.migrations.enabled) | quote }}
          readinessProbe:
            httpGet: { path: /api/v1/system/health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/v1/system/health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  # Caddy's routes name the API "api" in compose; here it is this service.
  name: {{ include "openrent.fullname" . }}-api
  labels: {{- include "openrent.labels" . | nindent 4 }}
spec:
  selector: {{- include "openrent.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports: [{ name: http, port: 7070, targetPort: http }]
