{{- if not .Values.secrets.existingSecret }}
{{- $name := include "openrent.secretName" . }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- if not .Values.database.url }}{{ fail "database.url is required (or secrets.existingSecret with DATABASE_URL)" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "openrent.labels" . | nindent 4 }}
  annotations:
    # Made before the migration Job, and kept with its generated keys when the release is removed.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{- /* Generated once: a key that changed would make every stored plugin secret unreadable. */}}
  OPENRENT_ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | b64enc | default (get $old "OPENRENT_ENCRYPTION_KEY") | default (randAscii 32 | b64enc | b64enc) | quote }}
  OPENRENT_SESSION_SECRET: {{ .Values.secrets.sessionSecret | b64enc | default (get $old "OPENRENT_SESSION_SECRET") | default (randAlphaNum 48 | b64enc) | quote }}
  DATABASE_URL: {{ .Values.database.url | b64enc | quote }}
  {{- with .Values.database.migrationUrl }}
  DATABASE_MIGRATION_URL: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.s3.accessKey }}
  S3_ACCESS_KEY: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.s3.secretKey }}
  S3_SECRET_KEY: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.email.smtpUrl }}
  SMTP_URL: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.stripe.secretKey }}
  STRIPE_SECRET_KEY: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.stripe.webhookSecret }}
  STRIPE_WEBHOOK_SECRET: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
