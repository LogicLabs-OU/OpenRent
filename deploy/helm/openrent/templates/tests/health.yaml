apiVersion: v1
kind: Pod
metadata:
  name: {{ include "openrent.fullname" . }}-health
  labels: {{- include "openrent.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext: {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    # The API answers its health check, and the storefront serves a page through it.
    - name: health
      image: {{ include "openrent.image" (dict "root" . "name" "api") }}
      command:
        - node
        - --input-type=module
        - -e
        - |
          const api = 'http://{{ include "openrent.fullname" . }}-api:7070';
          const sf = 'http://{{ include "openrent.fullname" . }}-storefront:7072';
          const ok = async (u) => { const r = await fetch(u); if (!r.ok) throw new Error(u + ' ' + r.status); console.log(u, r.status); };
          await ok(api + '/api/v1/system/health');
          // A new install has no shop yet, so any answer from the storefront will do.
          console.log(sf, (await fetch(sf + '/')).status);
