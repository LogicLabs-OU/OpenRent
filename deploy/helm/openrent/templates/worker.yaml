apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openrent.fullname" . }}-worker
  labels: {{- include "openrent.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels: {{- include "openrent.selector" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "openrent.selector" (dict "root" . "component" "worker") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "openrent.image" (dict "root" . "name" "worker") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "openrent.env" . | nindent 12 }}
            - name: AUTO_MIGRATE
              value: "false"
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
