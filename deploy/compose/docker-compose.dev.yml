# Only the backing services for `pnpm dev`: PostgreSQL 16, Mailpit and MinIO.
# For MinIO set S3_ENDPOINT=http://localhost:9000 S3_BUCKET=openrent S3_ACCESS_KEY=openrent S3_SECRET_KEY=openrent-dev in .env.
#   docker compose -f deploy/compose/docker-compose.dev.yml up -d
name: openrent-dev
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_DB: openrent, POSTGRES_USER: openrent, POSTGRES_PASSWORD: openrent }
    ports: ["5432:5432"]
    volumes: ["pg_dev:/var/lib/postgresql/data"]
  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]
  minio:
    image: minio/minio
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: openrent, MINIO_ROOT_PASSWORD: openrent-dev }
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_dev:/data"]
  minio-init:
    image: minio/mc
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 openrent openrent-dev; do sleep 1; done && mc mb --ignore-existing local/openrent"
volumes: { pg_dev: {}, minio_dev: {} }
